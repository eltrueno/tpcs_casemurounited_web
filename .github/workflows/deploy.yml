name: Deploy United to GitHub Pages

# El código vive en el monorepo eltrueno/TruenoProClubServices.
# Este repo solo existe porque GitHub Pages sirve un único sitio por repo:
# aquí se compila el mismo código con PUBLIC_CLUB=united.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [web-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          repository: eltrueno/TruenoProClubServices
          # El commit que acaba de desplegar el City (repository_dispatch) o main si se lanza a mano
          ref: ${{ github.event.client_payload.sha || 'main' }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        # Solo la web y sus dependencias del workspace (shared, auth). No se
        # instala eafcapi: trae puppeteer y su postinstall descarga Chrome.
        run: pnpm install --frozen-lockfile --filter @trueno-proclub-services/web...

      - name: Build de packages
        run: pnpm --filter @trueno-proclub-services/shared build && pnpm --filter @trueno-proclub-services/auth build

      - name: Build de la web
        run: pnpm --filter @trueno-proclub-services/web build
        env:
          PUBLIC_CLUB: ${{ vars.PUBLIC_CLUB || 'united' }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://united.casemuro.stream' }}
          # api y auth salen de config/club.ts salvo que se definan aquí
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_AUTH_URL: ${{ vars.PUBLIC_AUTH_URL }}

      - name: Dominio personalizado (CNAME)
        # Pages lee el dominio del artefacto; el host sale de PUBLIC_SITE_URL
        run: |
          host="${SITE#https://}"
          echo "${host%%/*}" > apps/web/dist/CNAME
        env:
          SITE: ${{ vars.PUBLIC_SITE_URL || 'https://united.casemuro.stream' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
